<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>566今天吃什么</title>
    
    <link rel="manifest" href="manifest.json?v=888">
    <meta name="theme-color" content="#fff0f5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="宝宝手帐">
    <link rel="apple-touch-icon" href="https://moonlitsilveriver.github.io/my-food-book/icon.png">
    
    <style>
        /* === 🍬 基础调色盘 (V7.1 经典色) === */
        :root { 
            --primary: #ff80ab; --primary-dark: #f06292;
            --bg-color: #fff0f5; --card-bg: #ffffff;
            --text: #5d4037; --accent: #ffb74d; --danger: #ef9a9a;
            --safe: #4fc3f7;
        }

        body { 
            font-family: "YouYuan", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#f8bbd0 2px, transparent 2px);
            background-size: 20px 20px;
            color: var(--text); margin: 0; padding: 20px; 
            min-height: 100vh; overflow-x: hidden; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .container { display: flex; flex-wrap: wrap; gap: 25px; max-width: 1200px; margin: 0 auto; align-items: flex-start; }
        .left-panel { flex: 1; min-width: 340px; } 
        .right-panel { flex: 1.5; min-width: 360px; }
        @media (max-width: 850px) { .left-panel, .right-panel { flex: 100%; min-width: 100%; } }

        /* 卡片样式 */
        .card { 
            background: var(--card-bg); padding: 20px; 
            border-radius: 20px; margin-bottom: 20px; 
            box-shadow: 0 8px 20px rgba(255, 128, 171, 0.15); 
            border: 2px solid #fff; position: relative;
        }
        h3 { color: var(--primary-dark); margin-top: 0; border-bottom: 2px dashed #ffcdd2; padding-bottom: 10px; display: flex; align-items: center; gap: 8px; }

        .input-row { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        input, select { padding: 10px; border: 2px solid #fce4ec; border-radius: 12px; flex: 1; outline: none; background: #fffbfb; }
        input:focus { border-color: var(--primary); }
        
        button { cursor: pointer; border: none; border-radius: 12px; font-weight: bold; padding: 10px 15px; transition: 0.2s; font-family: inherit; }
        button:active { transform: scale(0.95); }
        
        .btn-buy { background: linear-gradient(135deg, #a5d6a7, #66bb6a); color: white; width: 100%; text-shadow: 1px 1px 0 rgba(0,0,0,0.1); }
        .btn-cook { background: linear-gradient(135deg, #ffcc80, #ffa726); color: white; width: 100%; font-size: 1.1em; padding: 12px; margin-top: 10px; text-shadow: 1px 1px 0 rgba(0,0,0,0.1); }
        .btn-add { background: #f8bbd0; color: #880e4f; font-size: 0.8em; padding: 5px 12px; }
        .btn-del-mini { background: #ffcdd2; color: #c62828; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-left: 8px; flex-shrink: 0; }
        
        .btn-backup { background: linear-gradient(135deg, #81d4fa, #29b6f6); color: white; flex: 1; text-shadow: 1px 1px 0 rgba(0,0,0,0.1); }
        .btn-restore { background: #e0f7fa; color: #0277bd; flex: 1; border: 2px dashed #29b6f6; }

        .stock-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px dashed #fce4ec; }
        .ing-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; background: #fff8e1; padding: 8px; border-radius: 12px; flex-wrap: wrap; }
        .log-item { display: flex; justify-content: space-between; padding: 10px; background: #f3e5f5; margin-bottom: 8px; border-radius: 12px; font-size: 0.9em; }

        /* 日历样式 */
        .calendar-header { display: flex; justify-content: space-between; margin-bottom: 15px; background: #fff0f5; padding: 12px; border-radius: 15px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day-cell { background: white; min-height: 90px; padding: 5px; border-radius: 15px; border: 2px solid #fce4ec; font-size: 0.9em; display: flex; flex-direction: column; overflow: hidden; }
        .day-cell.today { border: 2px solid var(--primary); background: #fff8e1; position: relative; }
        .day-num { font-weight: bold; color: #d7ccc8; margin-bottom: 5px; }
        .day-cell.today .day-num { color: var(--primary); }
        .day-content { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        
        .dish-tag { display: block; padding: 2px 6px; border-radius: 6px; font-size: 0.75em; color: white; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; transition: 0.2s; }
        .dish-tag:active { transform: scale(0.9); }
        .meal-breakfast { background: #90caf9; } .meal-lunch { background: #ffcc80; } .meal-dinner { background: #ce93d8; }

        /* === 🧊 冰箱可视化 (V8.1 全显版) === */
        .btn-visual { background: linear-gradient(135deg, #4fc3f7, #0288d1); color: white; width: 100%; margin-top: 10px; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; display: none; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
        .fridge-modal { width: 95%; max-width: 450px; height: 92vh; background: white; border-radius: 25px; display: flex; flex-direction: column; overflow: hidden; animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes popUp { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .fridge-header { padding: 15px; background: #b3e5fc; display: flex; justify-content: space-between; align-items: center; }
        .fridge-header h3 { margin: 0; border: none; font-size: 1.1em; color: #01579b; }
        .btn-close { background: white; color: #01579b; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .fridge-content { flex: 1; overflow-y: auto; padding: 10px; background: #e1f5fe; display: flex; flex-direction: column; gap: 15px; }

        .grocery-bag { background: #fff9c4; border: 2px dashed #fbc02d; border-radius: 12px; padding: 10px; min-height: 80px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; cursor: pointer; }
        .grocery-label { width: 100%; font-size: 0.8em; color: #f9a825; margin-bottom: 5px; text-align: center; pointer-events: none; }

        .fridge-body { display: flex; flex-direction: column; gap: 10px; }
        
        .zone { background: rgba(255,255,255,0.7); border: 2px solid #81d4fa; border-radius: 10px; position: relative; display: flex; flex-wrap: wrap; gap: 4px; padding: 20px 4px 4px 4px; align-content: flex-start; overflow-y: auto; cursor: pointer; box-sizing: border-box; }
        .zone::before { content: attr(data-label); position: absolute; top: 1px; left: 5px; font-size: 0.55em; color: #81d4fa; pointer-events: none; }

        .top-section { border: 4px solid #b3e5fc; border-radius: 15px; padding: 5px; background: white; display: flex; flex-direction: column; gap: 5px; flex-shrink: 0; }
        .shelf { height: 75px; }
        
        .drawer-row { display: flex; gap: 5px; height: 85px; max-height: 85px; width: 100%; flex-shrink: 0; box-sizing: border-box; overflow: hidden; }
        #loc-t4 { height: 85px; background: #f1f8e9; border-color: #a5d6a7; flex-shrink: 0; }
        .drawer { flex: 1; background: #f1f8e9; border-color: #a5d6a7; height: 100%; min-width: 0; }

        .bottom-section { display: flex; gap: 10px; height: 260px; flex-shrink: 0; margin-top: 5px; }
        .bottom-col { flex: 1; border: 4px solid #b3e5fc; border-radius: 15px; padding: 5px; background: white; display: flex; flex-direction: column; gap: 5px; }
        .b-shelf { height: 60px; flex-shrink: 0;}
        .b-drawer { flex: 1; background: #e0f7fa; min-height: 0; }

        /* ✨ 修复：删除了宽度上限和省略号限制 */
        .food-block { 
            background: white; border: 1px solid #ff80ab; 
            border-radius: 6px; padding: 3px 6px; margin: 1px; 
            font-size: 0.72em; color: #880e4f; 
            white-space: nowrap; /* 保持不换行 */
            animation: popIn 0.3s; cursor: pointer; 
            box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
        }
        .food-block.selected { background: #ff80ab; color: white; border-color: white; box-shadow: 0 0 10px rgba(255, 128, 171, 0.6); transform: scale(1.05); z-index: 10; }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        .footer-status { text-align: center; color: var(--primary); font-size: 0.8em; margin-top: 30px; opacity: 0.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="left-panel">
        <div class="card">
            <h3>🍓 进货啦 <span style="font-size:0.6em; color:#aaa; font-weight:normal; margin-left:auto;">(记得填单位哦)</span></h3>
            <div class="input-row"><input type="text" id="buyName" placeholder="买了好吃的..." list="historyList" style="flex:2"></div>
            <div class="input-row">
                <input type="number" id="buyQty" placeholder="多少?" step="0.1">
                <select id="buyUnit" style="flex:0.8"><option value="个">个</option><option value="kg">kg</option><option value="g">g</option><option value="包">包</option><option value="瓶">瓶</option><option value="盒">盒</option></select>
                <button class="btn-buy" onclick="doBuy()" style="flex:0.8">✨ 入库</button>
            </div>
            <datalist id="historyList"></datalist>
        </div>

        <div class="card" style="border: 3px solid var(--accent);">
            <h3>🍯 小厨房 <span style="font-size:0.6em; color:#aaa; font-weight:normal; margin-left:auto;">(今天恰什么?)</span></h3>
            <div class="input-row"><input type="date" id="cookDate"><select id="mealType"><option value="breakfast">🌤️ 早餐</option><option value="lunch" selected>☀️ 午餐</option><option value="dinner">🌙 晚餐</option></select></div>
            <div class="input-row"><input type="text" id="dishName" placeholder="比如: 豪华泡面 🍜"></div>
            <div style="display:flex; justify-content:space-between; margin:15px 0 5px 0;"><span style="color:#8d6e63; font-size:0.9em;">🧂 消耗了哪些食材呀:</span><button class="btn-add" onclick="addIngRow()">+ 加一项</button></div>
            <div id="ingList"></div> 
            <button class="btn-cook" onclick="doCook()">💖 做好啦，开动！</button>
        </div>

        <div class="card">
            <h3>🧊 冰箱宝库</h3>
            <div id="stockList" style="max-height:180px; overflow-y:auto;"></div>
            <button class="btn-visual" onclick="openFridge()">🧊 打开可视冰箱 (点选整理)</button>
        </div>

        <div class="card">
            <h3>📒 碎碎念流水账</h3>
            <div id="mealLogList" style="max-height:150px; overflow-y:auto;"></div>
        </div>
        
        <div class="card" style="border: 2px dashed var(--safe);">
            <h3>📂 数据保险箱 <span style="font-size:0.6em; color:#aaa; font-weight:normal; margin-left:auto;">(搬家/备份用这里)</span></h3>
            <div class="input-row">
                <button class="btn-backup" onclick="exportData()">⬇️ 备份/导出数据</button>
                <button class="btn-restore" onclick="document.getElementById('fileInput').click()">⬆️ 恢复/导入数据</button>
                <input type="file" id="fileInput" style="display:none" onchange="importData(this)">
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="card">
            <div class="calendar-header">
                <button onclick="moveMonth(-1)">◀ 上月</button>
                <h3 id="monthTitle" style="margin:0; border:none; color:var(--text);">...</h3>
                <button onclick="moveMonth(1)">下月 ▶</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>
</div>

<div class="footer-status" id="systemStatus">正在启动 PWA... ✨</div>

<div class="modal-overlay" id="fridgeOverlay">
    <div class="fridge-modal">
        <div class="fridge-header"><h3>🧊 整理冰箱</h3><div class="btn-close" onclick="closeFridge()">×</div></div>
        <div class="fridge-content">
            <div class="grocery-bag zone" id="zone-unsorted"><div class="grocery-label">🛒 待整理区</div></div>
            <div class="fridge-body">
                <div class="top-section">
                    <div class="zone shelf" id="loc-t1" data-label="层1"></div>
                    <div class="zone shelf" id="loc-t2" data-label="层2"></div>
                    <div class="zone shelf" id="loc-t3" data-label="层3"></div>
                    <div class="zone" id="loc-t4" data-label="保鲜抽屉"></div>
                    <div class="drawer-row"><div class="zone drawer" id="loc-t5l" data-label="左抽"></div><div class="zone drawer" id="loc-t5r" data-label="右抽"></div></div>
                </div>
                <div class="bottom-section">
                    <div class="bottom-col"><div class="zone b-shelf" id="loc-bl1" data-label="左上"></div><div class="zone b-drawer" id="loc-bl2" data-label="左中"></div><div class="zone b-drawer" id="loc-bl3" data-label="左下"></div></div>
                    <div class="bottom-col"><div class="zone b-shelf" id="loc-br1" data-label="右上"></div><div class="zone b-drawer" id="loc-br2" data-label="右中"></div><div class="zone b-drawer" id="loc-br3" data-label="右下"></div></div>
                </div>
            </div>
        </div>
    </div>
</div>

 <!-- 引入 Firebase 脚本 -->
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-database-compat.js"></script>

<script>
  // ========= 1. Firebase 初始化与配置 =========
  const firebaseConfig = {
    apiKey: "AIzaSyDWew9lNxxJszHrDInouE1ZCMv1k5Y9b4o",
    authDomain: "gen-lang-client-0138974029.firebaseapp.com",
    databaseURL: "https://gen-lang-client-0138974029-default-rtdb.firebaseio.com", // 注意：非美区项目必须包含此项
    projectId: "gen-lang-client-0138974029",
    storageBucket: "gen-lang-client-0138974029.firebasestorage.app",
    messagingSenderId: "40265472206",
    appId: "1:40265472206:web:74b519d2ac4919cfd9189f",
  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }
  const db = firebase.database();
  const syncRef = db.ref('my_food_book_data/food_v5_data');

  // ========= 2. 全局状态与变量 =========
  const KEY = 'food_v5_data';
  let data = { stock: {}, meals: [] };
  let curDate = new Date();
  let selectedBlock = null;
  let isRemoteUpdating = false;

  // ========= 3. 本地与云端数据保存 =========
  function save(skipCloud = false) {
    localStorage.setItem(KEY, JSON.stringify(data));
    if (!skipCloud && !isRemoteUpdating) {
      syncRef.set(JSON.stringify(data)).catch(err => {
        console.warn("云端同步失败:", err);
      });
    }
  }

  // ========= 4. 监听 Firebase 云端实时同步 =========
  syncRef.on('value', (snapshot) => {
    const remoteVal = snapshot.val();
    if (remoteVal) {
      try {
        const parsed = typeof remoteVal === 'string' ? JSON.parse(remoteVal) : remoteVal;
        if (parsed && typeof parsed === 'object') {
          isRemoteUpdating = true;
          data = {
            stock: parsed.stock || {},
            meals: Array.isArray(parsed.meals) ? parsed.meals : []
          };
          localStorage.setItem(KEY, JSON.stringify(data));
          renderAll();
          isRemoteUpdating = false;
        }
      } catch (e) {
        console.error("解析云端数据出错:", e);
      }
    } else {
      // 若云端尚无数据，自动推送本地已有数据
      const localSaved = localStorage.getItem(KEY);
      if (localSaved) {
        syncRef.set(localSaved);
      }
    }
  });

  // ========= 5. 原系统核心业务功能函数 =========
  window.onload = function() {
    try {
      let saved = localStorage.getItem(KEY);
      if (saved) data = JSON.parse(saved);
      if (!data.stock) data.stock = {};
      if (!data.meals) data.meals = [];
    } catch(e) {}

    const cookDateInput = document.getElementById('cookDate');
    if (cookDateInput) cookDateInput.valueAsDate = new Date();
    
    addingRow();
    renderAll();

    const statusEl = document.getElementById('systemStatus');
    if (statusEl) statusEl.innerText = " 云端实时同步已就绪 | 食材名字全都能看清啦！";
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  };

  function selectBlock(id) {
    selectedBlock = id;
    document.querySelectorAll('.zone').forEach(el => el.classList.remove('active'));
    const target = document.getElementById(id);
    if (target) target.classList.add('active');
    
    const label = target ? target.getAttribute('data-label') : id;
    const nameEl = document.getElementById('selectedZoneName');
    if (nameEl) nameEl.innerText = label;
    
    renderStockList();
  }

  function saveStock() {
    if (!selectedBlock) {
      alert("请先点击左侧或上方的冰箱格子选择存放位置！");
      return;
    }
    const name = document.getElementById('ingName').value.trim();
    const count = parseFloat(document.getElementById('ingCount').value);
    const unit = document.getElementById('ingUnit').value;

    if (!name || isNaN(count) || count <= 0) {
      alert("请输入正确的食材名称和数量！");
      return;
    }

    if (!data.stock[name]) {
      data.stock[name] = { count: count, unit: unit, loc: selectedBlock };
    } else {
      data.stock[name].count += count;
      data.stock[name].loc = selectedBlock;
      data.stock[name].unit = unit;
    }

    save();
    renderAll();
    document.getElementById('ingName').value = '';
    document.getElementById('ingCount').value = '';
  }

  function addingRow() {
    const container = document.getElementById('ingRows');
    if (!container) return;
    const row = document.createElement('div');
    row.className = 'ing-row';
    
    let options = '<option value="">-- 选择食材 --</option>';
    for (let k in data.stock) {
      if (data.stock[k].count > 0) {
        options += `<option value="${k}">${k} (余${data.stock[k].count}${data.stock[k].unit || ''})</option>`;
      }
    }

    row.innerHTML = `
      <select class="ing-select" onchange="onIngSelectChange(this)">${options}</select>
      <input type="number" class="ing-consume-count" placeholder="用量" min="0.1" step="0.1">
      <span class="ing-unit-label" style="min-width:30px;font-size:12px;color:#666;">单位</span>
      <button type="button" onclick="this.parentElement.remove()" style="padding:4px 8px;background:#f56c6c;color:white;border:none;border-radius:4px;cursor:pointer;">×</button>
    `;
    container.appendChild(row);
  }

  function onIngSelectChange(selectEl) {
    const row = selectEl.parentElement;
    const val = selectEl.value;
    const unitLabel = row.querySelector('.ing-unit-label');
    if (val && data.stock[val]) {
      unitLabel.innerText = data.stock[val].unit || '';
    } else {
      unitLabel.innerText = '单位';
    }
  }

  function recordMeal() {
    const title = document.getElementById('mealTitle').value.trim();
    const dateVal = document.getElementById('cookDate').value;
    const rows = document.querySelectorAll('.ing-row');
    
    if (!title) {
      alert("请输入餐品名称！");
      return;
    }

    let consumed = [];
    for (let r of rows) {
      const select = r.querySelector('.ing-select');
      const countInput = r.querySelector('.ing-consume-count');
      if (select && select.value && countInput && countInput.value) {
        const ingName = select.value;
        const cnt = parseFloat(countInput.value);
        if (cnt > 0) {
          consumed.push({ name: ingName, count: cnt, unit: data.stock[ingName]?.unit || '' });
          if (data.stock[ingName]) {
            data.stock[ingName].count = Math.max(0, data.stock[ingName].count - cnt);
          }
        }
      }
    }

    data.meals.unshift({
      id: Date.now(),
      title: title,
      date: dateVal || new Date().toISOString().split('T')[0],
      ingredients: consumed
    });

    save();
    renderAll();

    document.getElementById('mealTitle').value = '';
    document.getElementById('ingRows').innerHTML = '';
    addingRow();
  }

  function changeDate(days) {
    curDate.setDate(curDate.getDate() + days);
    renderDietHistory();
  }

  function deleteStockItem(name) {
    if (confirm(`确定删除食材 ${name} 吗？`)) {
      delete data.stock[name];
      save();
      renderAll();
    }
  }

  function deleteMeal(id) {
    if (confirm("确定删除这条饮食记录吗？")) {
      data.meals = data.meals.filter(m => m.id !== id);
      save();
      renderAll();
    }
  }

  // ========= 6. 渲染视图函数 =========
  function renderAll() {
    renderFridgeGrids();
    renderStockList();
    renderDietHistory();
    updateAllIngSelects();
  }

  function renderFridgeGrids() {
    document.querySelectorAll('.zone').forEach(el => {
      const zoneId = el.id;
      const label = el.getAttribute('data-label') || zoneId;
      let count = 0;
      for (let k in data.stock) {
        if (data.stock[k].loc === zoneId && data.stock[k].count > 0) {
          count++;
        }
      }
      el.innerHTML = `<span class="zone-title">${label}</span><span class="zone-badge">${count}种</span>`;
    });
  }

  function renderStockList() {
    const listEl = document.getElementById('stockList');
    if (!listEl) return;
    listEl.innerHTML = '';

    for (let k in data.stock) {
      const item = data.stock[k];
      if (selectedBlock && item.loc !== selectedBlock) continue;
      if (item.count <= 0) continue;

      const card = document.createElement('div');
      card.className = 'stock-item-tag';
      card.innerHTML = `
        <span class="st-name">${k}</span>
        <span class="st-count">${item.count} ${item.unit || ''}</span>
        <button class="st-del" onclick="deleteStockItem('${k}')">×</button>
      `;
      listEl.appendChild(card);
    }
  }

  function renderDietHistory() {
    const historyEl = document.getElementById('dietHistory');
    if (!historyEl) return;
    historyEl.innerHTML = '';

    const dateStr = curDate.toISOString().split('T')[0];
    const curDateEl = document.getElementById('curDateDisplay');
    if (curDateEl) curDateEl.innerText = dateStr;

    const todayMeals = data.meals.filter(m => m.date === dateStr);
    if (todayMeals.length === 0) {
      historyEl.innerHTML = '<div style="color:#999;font-size:13px;text-align:center;padding:12px;">当天暂无记录</div>';
      return;
    }

    todayMeals.forEach(m => {
      const item = document.createElement('div');
      item.className = 'meal-record-card';
      const ings = m.ingredients.map(i => `${i.name} × ${i.count}${i.unit}`).join(', ');
      item.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <strong style="font-size:14px;color:#333;">${m.title}</strong>
          <button onclick="deleteMeal(${m.id})" style="border:none;background:transparent;color:#999;cursor:pointer;font-size:16px;">×</button>
        </div>
        <div style="font-size:12px;color:#666;margin-top:4px;">${ings ? '消耗: ' + ings : '无消耗食材'}</div>
      `;
      historyEl.appendChild(item);
    });
  }

  function updateAllIngSelects() {
    document.querySelectorAll('.ing-row').forEach(row => {
      const select = row.querySelector('.ing-select');
      if (!select) return;
      const currentVal = select.value;
      let options = '<option value="">-- 选择食材 --</option>';
      for (let k in data.stock) {
        if (data.stock[k].count > 0) {
          options += `<option value="${k}">${k} (余${data.stock[k].count}${data.stock[k].unit || ''})</option>`;
        }
      }
      select.innerHTML = options;
      select.value = currentVal;
    });
  }
</script>
</body>
</html>
