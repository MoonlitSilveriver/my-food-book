<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 引入 Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>今天吃什么</title>
    
    <link rel="manifest" href="manifest.json?v=888">
    <meta name="theme-color" content="#fff0f5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="宝宝手帐">
    <link rel="apple-touch-icon" href="https://moonlitsilveriver.github.io/my-food-book/icon.png">

    <style>
        :root { --p: #ff6b81; --bg: #fff0f5; --card: #fff; --text: #2f3542; }
        body { font-family: 'Comic Sans MS', 'PingFang SC', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 10px; padding-bottom: 80px; }
        .card { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(255,107,129,0.1); border: 2px dashed #ffeaa7; }
        h2 { color: var(--p); margin-top: 0; font-size: 1.2em; display: flex; align-items: center; gap: 5px; }
        input, select, button { border: 2px solid #f1f2f6; border-radius: 10px; padding: 8px; font-size: 14px; box-sizing: border-box; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--p); }
        button { background: var(--p); color: white; border: none; cursor: pointer; font-weight: bold; }
        button:active { transform: scale(0.95); }
        .row { display: flex; gap: 5px; margin-bottom: 10px; }
        .row > * { flex: 1; }
        .ing-row { display: flex; gap: 5px; margin-bottom: 5px; align-items: center; }
        .del-btn { background: #ff4757; width: 30px; padding: 0; border-radius: 50%; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 12px; }
        
        .tabs { display: flex; margin-bottom: 10px; background: white; border-radius: 10px; padding: 3px; }
        .tab { flex: 1; text-align: center; padding: 8px; border-radius: 8px; cursor: pointer; font-weight: bold; color: #a4b0be; }
        .tab.active { background: var(--p); color: white; }
        .content { display: none; }
        .content.active { display: block; }
        
        .stock-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; }
        .stock-item { background: #f1f2f6; padding: 8px; border-radius: 10px; text-align: center; position: relative; border: 2px solid transparent; cursor: pointer; transition: 0.2s; }
        .stock-item:hover { border-color: var(--p); background: #ffeaa7; }
        .stock-item .name { font-weight: bold; font-size: 14px; margin-bottom: 2px; }
        .stock-item .qty { color: var(--p); font-size: 12px; }
        .stock-item .del-stock { position: absolute; top: -5px; right: -5px; background: #ff4757; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 10px; line-height: 18px; text-align: center; display: none; cursor: pointer; }
        .stock-item:hover .del-stock { display: block; }
        
        .meal-list { display: flex; flex-direction: column; gap: 10px; }
        .meal-item { background: #fdf5f6; padding: 10px; border-radius: 10px; border-left: 4px solid var(--p); position: relative; }
        .meal-time { font-size: 12px; color: #747d8c; margin-bottom: 5px; }
        .meal-name { font-weight: bold; margin-bottom: 5px; }
        .meal-ings { font-size: 12px; color: #57606f; }
        .meal-del { position: absolute; right: 10px; top: 10px; color: #ff4757; cursor: pointer; font-size: 16px; background: none; border: none; padding: 0; }
        
        .fridge-view { display: flex; flex-direction: column; gap: 10px; }
        .fridge-block { border: 2px dashed #dfe4ea; border-radius: 10px; padding: 10px; position: relative; min-height: 50px; background: #fafafa; }
        .fridge-block::before { content: attr(data-title); position: absolute; top: -10px; left: 10px; background: var(--bg); padding: 0 5px; font-size: 12px; color: #a4b0be; font-weight: bold; }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: var(--p); margin-top: 5px; font-size: 1.5em;">🍓 宝宝的投喂日记</h1>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('record')">📝 记录</div>
        <div class="tab" onclick="switchTab('fridge')">🧊 冰箱</div>
        <div class="tab" onclick="switchTab('stats')">📊 历史</div>
    </div>

    <!-- 记录页 -->
    <div id="record" class="content active">
        <div class="card">
            <h2>🛒 进货啦 (塞进冰箱)</h2>
            <div class="row">
                <input id="inName" placeholder="买的啥？(如: 鸡蛋)" list="historyList" style="flex:2">
                <input id="inQty" type="number" placeholder="数量" style="flex:1">
                <select id="inUnit" style="flex:1">
                    <option value="个">个</option>
                    <option value="克">克</option>
                    <option value="斤">斤</option>
                    <option value="把">把</option>
                    <option value="包">包</option>
                    <option value="盒">盒</option>
                    <option value="份">份</option>
                </select>
            </div>
            <div class="row" style="margin-bottom: 0;">
                <select id="inLocation" style="flex:2">
                    <option value="冷藏室">🧊 冷藏室</option>
                    <option value="冷冻室">❄️ 冷冻室</option>
                    <option value="常温区">📦 常温区</option>
                </select>
                <button onclick="addStock()" style="flex:1">📥 塞进去</button>
            </div>
        </div>

        <div class="card">
            <h2>🍽️ 吃掉啦 (消耗食材)</h2>
            <input id="mealName" placeholder="这顿叫啥名？(如: 西红柿炒蛋)" style="width: 100%; margin-bottom: 10px;">
            <div id="ingList">
                <div class="ing-row">
                    <input class="i-name" placeholder="食材名" list="historyList" onchange="fillUnit(this)" style="flex:1.5">
                    <input type="number" class="i-qty" placeholder="量" style="flex:1">
                    <!-- 【修复】：将普通 input 改为下拉 select -->
                    <select class="i-unit" style="flex:1">
                        <option value="个">个</option>
                        <option value="克">克</option>
                        <option value="斤">斤</option>
                        <option value="把">把</option>
                        <option value="包">包</option>
                        <option value="盒">盒</option>
                        <option value="份">份</option>
                    </select>
                    <button class="del-btn" onclick="this.parentElement.remove()">X</button>
                </div>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button onclick="addingRow()" style="background: #a4b0be; flex: 1;">+ 加一种食材</button>
                <button onclick="addMeal()" style="flex: 2;">😋 记在小本本上</button>
            </div>
        </div>
    </div>

    <!-- 冰箱页 -->
    <div id="fridge" class="content">
        <div class="card">
            <h2>👀 看看冰箱里有啥</h2>
            <div class="fridge-view" id="fridgeView"></div>
        </div>
    </div>

    <!-- 历史页 -->
    <div id="stats" class="content">
        <div class="card">
            <h2 style="justify-content: space-between;">
                <span>📖 吃饭小账本</span>
                <span style="font-size: 12px; color: #a4b0be; font-weight: normal; cursor: pointer;" onclick="if(confirm('要清空所有吃饭记录吗？库存不会清空哦')){data.meals=[];save();renderAll();}">🗑️清空记录</span>
            </h2>
            <div class="meal-list" id="mealListOut"></div>
        </div>
        
        <!-- 数据管理模块，放到底部 -->
        <div style="margin-top: 30px; padding: 15px; border-top: 2px dashed #dfe4ea; text-align: center; color: #747d8c; font-size: 12px;">
            <p>🔧 数据管理 (全在本地哦)</p>
            <div style="display: flex; gap: 10px; justify-content: center; margin-top: 10px;">
                <button onclick="exportData()" style="background: #7bed9f; color: #2f3542; padding: 5px 10px;">导出备份</button>
                <button onclick="document.getElementById('importFile').click()" style="background: #70a1ff; color: white; padding: 5px 10px;">导入数据</button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importData(this)">
            </div>
        </div>
    </div>

    <datalist id="historyList"></datalist>

<!-- ================= Firebase 配置悬浮窗 UI ================= -->
<button id="cloudSyncBtn" style="position: fixed; bottom: 20px; right: 20px; z-index: 1000; padding: 10px 15px; background-color: #4CAF50; color: white; border: none; border-radius: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.2);">
    ☁️ 连接云端同步
</button>

<div id="firebaseConfigModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1001;">
    <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 12px; width: 80%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <h3 style="margin-top: 0; color: #ff6b81;">配置 Firebase 同步</h3>
        <p style="font-size: 12px; color: #666;">请将 Firebase 控制台提供的 <b>firebaseConfig</b> 对象代码直接粘贴在下方：</p>
        <textarea id="firebaseConfigInput" style="width: 100%; height: 150px; padding: 10px; border: 1px solid #ccc; border-radius: 6px; resize: none; font-family: monospace;" placeholder="const firebaseConfig = {&#10;  apiKey: '...',&#10;  authDomain: '...',&#10;  ...&#10;};"></textarea>
        <div style="margin-top: 15px; display: flex; justify-content: flex-end; gap: 10px;">
            <button id="closeModalBtn" style="padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; background: #eee; color: #333;">取消</button>
            <button id="saveConfigBtn" style="padding: 8px 15px; border: none; border-radius: 6px; cursor: pointer; background: #ff6b81; color: white;">保存并连接</button>
        </div>
    </div>
</div>

<script>
    // --- 核心数据初始化 ---
    let data = JSON.parse(localStorage.getItem('my_diet_diary')) || { stock: {}, meals: [] };

    // --- Firebase 云端同步逻辑 ---
    let isCloudConnected = false;
    let cloudDb = null;

    document.addEventListener('DOMContentLoaded', () => {
        const syncBtn = document.getElementById('cloudSyncBtn');
        const modal = document.getElementById('firebaseConfigModal');
        const saveBtn = document.getElementById('saveConfigBtn');
        const closeBtn = document.getElementById('closeModalBtn');
        const configInput = document.getElementById('firebaseConfigInput');

        syncBtn.addEventListener('click', () => modal.style.display = 'block');
        closeBtn.addEventListener('click', () => modal.style.display = 'none');

        // 尝试静默连接
        const savedConfig = localStorage.getItem('dietDiary_FirebaseConfig');
        if (savedConfig) {
            initFirebaseAndSync(JSON.parse(savedConfig));
        }

        saveBtn.addEventListener('click', () => {
            try {
                const rawText = configInput.value;
                const jsonMatch = rawText.match(/\{[\s\S]*\}/);
                if (!jsonMatch) throw new Error("未识别到有效的配置结构");
                
                const configObj = new Function('return ' + jsonMatch[0])();
                localStorage.setItem('dietDiary_FirebaseConfig', JSON.stringify(configObj));
                
                initFirebaseAndSync(configObj);
                modal.style.display = 'none';
                alert("✨ 云端同步配置成功！");
            } catch (e) {
                alert("配置解析失败，请确保粘贴了完整的 config 代码块哦。");
                console.error(e);
            }
        });
    });

    function initFirebaseAndSync(config) {
        if (!firebase.apps.length) {
            firebase.initializeApp(config);
        }
        cloudDb = firebase.firestore();
        isCloudConnected = true;
        
        const syncBtn = document.getElementById('cloudSyncBtn');
        syncBtn.textContent = "✅ 云端已连接";
        syncBtn.style.backgroundColor = "#ff6b81"; 

        // 初次连接，尝试拉取云端数据
        cloudDb.collection('my_diet_diary').doc('user_data').get().then((doc) => {
            if (doc.exists) {
                data = doc.data(); 
                save(false); // 保存到本地，但不触发反向云同步
                renderAll();
                console.log("☁️ 已从云端加载最新数据！");
            }
        }).catch(error => console.error("读取云端数据失败:", error));
    }

    function syncDataToCloud() {
        if (isCloudConnected && cloudDb) {
            cloudDb.collection('my_diet_diary').doc('user_data').set(data)
                .catch(error => console.error("同步云端失败: ", error));
        }
    }

    // --- 修改后的本地保存函数，集成了云同步 ---
    function save(syncToCloud = true) {
        localStorage.setItem('my_diet_diary', JSON.stringify(data));
        // 如果允许同步到云端，则执行同步
        if (syncToCloud) {
            syncDataToCloud();
        }
    }

    // --- 页面逻辑 ---
    renderAll();

    function switchTab(t) { 
        document.querySelectorAll('.tab, .content').forEach(e => e.classList.remove('active')); 
        document.querySelector(`.tab[onclick="switchTab('${t}')"]`).classList.add('active'); 
        document.getElementById(t).classList.add('active'); 
        if(t==='fridge') renderFridgeBlocks(); 
    }

    function formatTime(d) { 
        return `${d.getMonth()+1}-${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; 
    }

    function addStock() {
        let n = document.getElementById('inName').value.trim();
        let q = parseFloat(document.getElementById('inQty').value);
        let u = document.getElementById('inUnit').value;
        let l = document.getElementById('inLocation').value;
        if(!n || isNaN(q)) return alert('名字和数量都要填对哦！');
        
        if(!data.stock[n]) data.stock[n] = { q:0, u:u, l:l };
        if(data.stock[n].u !== u) { if(!confirm(`之前记录的单位是 [${data.stock[n].u}]，要强制改成 [${u}] 并累加吗？`)) return; }
        
        data.stock[n].q += q; data.stock[n].u = u; data.stock[n].l = l;
        save(); renderAll(); alert(`✅ ${n} 放进 ${l} 啦！`);
        document.getElementById('inName').value=''; document.getElementById('inQty').value='';
    }

    function addMeal() {
        let mn = document.getElementById('mealName').value.trim();
        let rows = document.querySelectorAll('.ing-row');
        let ings = [];
        let lack = [];
        
        rows.forEach(r => {
            let n = r.querySelector('.i-name').value.trim();
            let q = parseFloat(r.querySelector('.i-qty').value);
            let u = r.querySelector('.i-unit').value;
            if(!n || isNaN(q)) return;
            ings.push({n, q, u});
            if(!data.stock[n] || data.stock[n].q < q) lack.push(n);
        });
        
        if(!mn || ings.length===0) return alert('饭名和食材都要填哦！');
        if(lack.length > 0) { if(!confirm(`冰箱里没有足够的：${lack.join('、')}，还要继续记录并扣到负数吗？`)) return; }
        
        ings.forEach(i => {
            if(!data.stock[i.n]) data.stock[i.n] = {q:0, u:i.u, l:'未知'};
            data.stock[i.n].q -= i.q;
            // 如果食材吃光了，询问是否清理
            if(data.stock[i.n].q <= 0) {
                 if(confirm(`[${i.n}] 好像已经吃光啦（或者变成负数了），要从冰箱列表里清掉它吗？`)) {
                     delete data.stock[i.n];
                 }
            }
        });
        
        data.meals.unshift({ id: Date.now(), t: formatTime(new Date()), mn, ings });
        save(); renderAll(); alert('😋 记好啦！');
        document.getElementById('mealName').value='';
        document.getElementById('ingList').innerHTML=`<div class="ing-row"><input class="i-name" placeholder="食材名" list="historyList" onchange="fillUnit(this)" style="flex:1.5"><input type="number" class="i-qty" placeholder="量" style="flex:1"><select class="i-unit" style="flex:1"><option value="个">个</option><option value="克">克</option><option value="斤">斤</option><option value="把">把</option><option value="包">包</option><option value="盒">盒</option><option value="份">份</option></select><button class="del-btn" onclick="this.parentElement.remove()">X</button></div>`;
    }

    function renderAll() {
        // 更新下拉提示
        let dl = document.getElementById('historyList');
        dl.innerHTML = Object.keys(data.stock).map(k => `<option value="${k}">`).join('');
        
        // 更新记录页的食材列表
        let mHTML = '';
        data.meals.forEach(m => {
            mHTML += `<div class="meal-item"><button class="meal-del" onclick="deleteMeal(${m.id})">×</button>
            <div class="meal-time">${m.t}</div><div class="meal-name">🍲 ${m.mn}</div>
            <div class="meal-ings">使用了: ${m.ings.map(i=>`${i.n}(${i.q}${i.u})`).join('、')}</div></div>`;
        });
        document.getElementById('mealListOut').innerHTML = mHTML || '<div style="color:#a4b0be;text-align:center;">还没有记录哦，快去吃点好的~</div>';
    }

    function renderFridgeBlocks() {
        let f = document.getElementById('fridgeView'); f.innerHTML = '';
        let locs = {'冷藏室':{}, '冷冻室':{}, '常温区':{}, '未知':{}};
        
        for(let k in data.stock) { locs[data.stock[k].l || '未知'][k] = data.stock[k]; }
        
        for(let l in locs) {
            if(Object.keys(locs[l]).length === 0) continue;
            let div = document.createElement('div'); div.className = 'fridge-block'; div.setAttribute('data-title', l);
            let grid = document.createElement('div'); grid.className = 'stock-grid';
            for(let k in locs[l]) {
                grid.innerHTML += `<div class="stock-item"><div class="del-stock" onclick="deleteStock('${k}')">×</div><div class="name">${k}</div><div class="qty">${locs[l][k].q.toFixed(1).replace(/\.0$/,'')} ${locs[l][k].u}</div></div>`;
            }
            div.appendChild(grid); f.appendChild(div);
        }
        if(f.innerHTML==='') f.innerHTML = '<div style="color:#a4b0be;text-align:center;">冰箱空空如也，该进货啦！</div>';
    }

    function addingRow() {
        let d = document.createElement('div'); d.className='ing-row';
        // 【修复】：新增加的行也使用 select
        d.innerHTML = `<input class="i-name" placeholder="食材名" list="historyList" onchange="fillUnit(this)" style="flex:1.5"><input type="number" class="i-qty" placeholder="量" style="flex:1"><select class="i-unit" style="flex:1"><option value="个">个</option><option value="克">克</option><option value="斤">斤</option><option value="把">把</option><option value="包">包</option><option value="盒">盒</option><option value="份">份</option></select><button class="del-btn" onclick="this.parentElement.remove()">X</button>`;
        document.getElementById('ingList').appendChild(d);
    }

    function fillUnit(i) { if(data.stock[i.value]) i.parentElement.querySelector('.i-unit').value = data.stock[i.value].u; }
    
    function deleteStock(n) { if(confirm(`(・_・) 确定要把冰箱里的 [${n}] 全部清空吗？`)) { delete data.stock[n]; save(); renderAll(); renderFridgeBlocks(); } }
    
    function deleteMeal(id) { if(confirm(`(qwq) 确定要擦掉这条用餐记录吗？`)) { data.meals = data.meals.filter(m => m.id !== id); save(); renderAll(); } }
    
    function exportData() { let blob = new Blob([JSON.stringify(data)], {type: "application/json"}); let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `宝宝饭本本_${Date.now()}.json`; a.click(); }
    
    function importData(input) { if(!confirm("⚠️ 警告：导入会覆盖当前数据哦！确定吗？")) return; let reader = new FileReader(); reader.onload = (e) => { data = JSON.parse(e.target.result); save(); renderAll(); alert("导入成功！"); }; reader.readAsText(input.files[0]); }
    
    // Service Worker 注册 (用于 PWA 和离线支持)
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('sw.js').then(registration => {
                console.log('SW registered: ', registration);
            }).catch(registrationError => {
                console.log('SW registration failed: ', registrationError);
            });
        });
    }
</script>
</body>
</html>
